spring.application.name=stock-management-app
spring.datasource.url=jdbc:postgresql://${DB_HOST:${SPRING_DATASOURCE_HOST:localhost}}:${DB_PORT:${SPRING_DATASOURCE_PORT:5432}}/${DB_NAME:${SPRING_DATASOURCE_DATABASE:stock_management_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
server.port=${PORT:8080}


app.jwt.secret=${APP_JWT_SECRET:ChangeThisToAVeryLongSecureKeyForProductionUse12345}
app.jwt.expiration-millis=604800000
